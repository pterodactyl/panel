x-panel-environment: &panel-environment
  APP_URL: "http://example.com"
  APP_TIMEZONE: "UTC"
  APP_SERVICE_AUTHOR: "noreply@example.com"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_ENVIRONMENT_ONLY: "true"
  # For multiple replicas, supply the same APP_KEY and HASHIDS_SALT to every replica.
  # APP_KEY: "base64:..."
  # HASHIDS_SALT: "..."
  # Set LE_EMAIL only when this container terminates HTTPS with Let's Encrypt.
  # LE_EMAIL: "admin@example.com"
  DB_HOST: "database"
  DB_PORT: "3306"
  DB_DATABASE: "panel"
  DB_USERNAME: "pterodactyl"
  DB_PASSWORD: &db-password "CHANGE_ME"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  SESSION_CONNECTION: "sessions"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "cache"
  REDIS_QUEUE_RETRY_AFTER: "90"
  MAIL_MAILER: "smtp"
  MAIL_FROM_ADDRESS: "noreply@example.com"
  MAIL_HOST: "mail.example.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_ENCRYPTION: "tls"
  QUEUE_WORKER_ENABLED: "true"
  # Enable the scheduler on exactly one replica.
  SCHEDULER_ENABLED: "true"

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - "/srv/pterodactyl/database:/var/lib/mysql"
    environment:
      MARIADB_PASSWORD: *db-password
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: "panel"
      MARIADB_USER: "pterodactyl"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "/srv/pterodactyl/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    # Longer than the worker timeout; lets running jobs finish before shutdown.
    stop_grace_period: 90s
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - "/srv/pterodactyl/var:/app/var"
      - "/srv/pterodactyl/nginx:/etc/nginx/http.d"
      - "/srv/pterodactyl/certs:/etc/letsencrypt"
      - "/srv/pterodactyl/logs:/app/storage/logs"
      - "/srv/pterodactyl/extensions:/app/extensions"
      - "/srv/pterodactyl/extension-assets:/app/public/assets/extensions"
    environment: *panel-environment

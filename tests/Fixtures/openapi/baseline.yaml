      tags:
        - 'Admin API'
  /api/admin/extensions:
    get:
      summary: 'List extensions'
      operationId: adminListExtensions
      description: 'Returns discovered extensions, invalid manifests, and their install state.'
      parameters: []
      responses:
        '200':
          description: 'Extensions returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListExtensionsResponseBody'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      tags:
        - 'Admin API'
    post:
      summary: 'Install extension'
      operationId: adminInstallExtension
      description: 'Installs an uploaded .pteroext or .zip extension package.'
      parameters: []
      responses:
        '201':
          description: 'Extension installed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInstallExtensionResponseBody'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'The submitted data is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
      tags:
        - 'Admin API'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminInstallExtensionRequest'
      security:
        -
          panelSession: []
  /api/admin/extensions/forms:
    get:
      summary: 'List extension forms'
      operationId: adminListExtensionForms
      description: 'Returns, for each admin form, the enabled extensions that add fields to it and that the signed-in administrator may edit. Forms without extension fields are left out.'
      parameters: []
      responses:
        '200':
          description: 'Extension forms returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExtensionFormsResponse'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      tags:
        - 'Admin API'
  '/api/admin/extensions/{extension}/settings':
    get:
      summary: 'Get extension settings'
      operationId: adminGetExtensionSettings
      description: 'Returns the auto-render form schema (with current public values) for an extension that registered a settings definition.'
      parameters: []
      responses:
        '200':
          description: 'Settings schema returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGetExtensionSettingsResponseBody'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'The requested resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      tags:
        - 'Admin API'
    patch:
      summary: 'Update extension settings'
      operationId: adminUpdateExtensionSettings
      description: "Validates against each field's type and the extension's declared rules and persists the submitted values. Omitted fields keep their stored values, as do secrets submitted empty or as their mask."
      parameters: []
      responses:
        '200':
          description: 'Settings updated; fresh schema returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUpdateExtensionSettingsResponseBody'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'The requested resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'The submitted data is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
      tags:
        - 'Admin API'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateExtensionSettingsRequest'
      security:
        -
          panelSession: []
    parameters:
      -
        in: path
        name: extension
        description: 'The extension identifier.'
        required: true

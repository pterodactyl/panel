openapi: 3.0.3
info:
  title: 'Pterodactyl API Reference'
  description: 'OpenAPI reference for the Application, Client, and Admin APIs.'
  version: 1.0.0
tags:
  -
    name: 'Admin API'
    description: 'Root administrator endpoints for managing panel configuration and resources.'
  -
    name: 'Application API'
    description: 'Root administrator endpoints for managing panel resources using application API tokens.'
  -
    name: Authentication
    description: 'Browser session authentication endpoints used by the panel frontend.'
  -
    name: 'Client API'
    description: 'Endpoints authenticated as a panel user using a client API token.'
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Application API requests require an application API token, or a client API token, that belongs to a root administrator. Admin API requests require a client API token that belongs to a root administrator, and reject application API tokens. Client API requests require a client API token.'
    panelSession:
      type: apiKey
      in: cookie
      name: pterodactyl_session
      description: 'Browser session cookie used by the panel frontend.'
  schemas:
    AdminActivityLogAttributes:
      type: object
      required:
        - id
        - batch
        - event
        - is_api
        - ip
        - description
        - properties
        - has_additional_metadata
        - timestamp
      properties:
        id:
          type: string
        batch:
          type: string
          nullable: true
        event:
          type: string
        is_api:
          type: boolean
        ip:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties:
            oneOf:
              -
                type: string
              -
                type: integer
              -
                type: number
              -
                type: boolean
              -
                type: array
                items:
                  type: string
              -
                type: object
                additionalProperties:
                  type: string
        has_additional_metadata:
          type: boolean
        timestamp:
          type: string
        relationships:
          type: object
          properties:
            actor:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminUserResource'
                -
                  $ref: '#/components/schemas/NullResource'
    AdminActivityLogPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminActivityLogResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminActivityLogResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminActivityLogAttributes'
    AdminAllocationAttributes:
      type: object
      required:
        - id
        - ip
        - alias
        - port
        - notes
        - server_id
        - server_name
        - assigned
      properties:
        id:
          type: integer
        ip:
          type: string
        alias:
          type: string
          nullable: true
        port:
          type: integer
        notes:
          type: string
          nullable: true
        server_id:
          type: integer
          nullable: true
        server_name:
          type: string
          nullable: true
        assigned:
          type: boolean
    AdminAllocationListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAllocationResource'
    AdminAllocationPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAllocationResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminAllocationResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminAllocationAttributes'
    AdminApiKeyAttributes:
      type: object
      required:
        - identifier
        - memo
        - created_by
        - last_used_at
        - created_at
        - r_servers
        - r_nodes
        - r_allocations
        - r_users
        - r_locations
        - r_eggs
        - r_database_hosts
        - r_server_databases
      properties:
        identifier:
          type: string
        memo:
          type: string
        created_by:
          type: object
          required:
            - id
            - username
            - email
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
        last_used_at:
          type: string
          nullable: true
        created_at:
          type: string
        r_servers:
          type: integer
        r_nodes:
          type: integer
        r_allocations:
          type: integer
        r_users:
          type: integer
        r_locations:
          type: integer
        r_eggs:
          type: integer
        r_database_hosts:
          type: integer
        r_server_databases:
          type: integer
    AdminApiKeyPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminApiKeyResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminApiKeyResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminApiKeyAttributes'
        meta:
          type: object
          required:
            - secret_token
          properties:
            secret_token:
              type: string
    AdminBackupAttributes:
      type: object
      required:
        - uuid
        - name
        - ignored_files
        - checksum
        - bytes
        - is_successful
        - is_locked
        - created_at
        - completed_at
      properties:
        uuid:
          type: string
        name:
          type: string
        ignored_files:
          type: array
          items:
            type: string
        checksum:
          type: string
          nullable: true
        bytes:
          type: integer
        is_successful:
          type: boolean
        is_locked:
          type: boolean
        created_at:
          type: string
        completed_at:
          type: string
          nullable: true
    AdminBackupPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminBackupResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminBackupResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminBackupAttributes'
    AdminDatabaseAttributes:
      type: object
      required:
        - server
        - name
        - username
        - connections_from
        - max_connections
      properties:
        server:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string
        name:
          type: string
        username:
          type: string
        connections_from:
          type: string
        max_connections:
          type: integer
          nullable: true
    AdminDatabaseHostAttributes:
      type: object
      required:
        - id
        - name
        - host
        - port
        - username
        - max_databases
        - databases_count
        - node_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        max_databases:
          type: integer
          nullable: true
        databases_count:
          type: integer
        node_id:
          type: integer
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        extensions:
          $ref: '#/components/schemas/ExtensionFields'
        relationships:
          type: object
          properties:
            node:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminNodeResource'
                -
                  $ref: '#/components/schemas/NullResource'
            databases:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminDatabaseListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
    AdminDatabaseHostPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDatabaseHostResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminDatabaseHostResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminDatabaseHostAttributes'
        meta:
          type: object
          required:
            - resource
          properties:
            resource:
              type: string
    AdminDatabaseListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDatabaseResource'
    AdminDatabasePaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDatabaseResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminDatabaseResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminDatabaseAttributes'
    AdminEggAttributes:
      type: object
      required:
        - id
        - uuid
        - author
        - name
        - description
        - features
        - docker_image
        - docker_images
        - force_outgoing_ip
        - config
        - startup
        - script
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        uuid:
          type: string
        author:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
          nullable: true
        docker_image:
          type: string
        docker_images:
          type: object
          additionalProperties:
            type: string
        force_outgoing_ip:
          type: boolean
          nullable: true
        config:
          type: object
          required:
            - files
            - startup
            - stop
            - logs
            - file_denylist
            - extends
          properties:
            files:
              allOf:
                -
                  $ref: '#/components/schemas/AdminEggConfigurationFiles'
              nullable: true
            startup:
              type: object
              additionalProperties:
                oneOf:
                  -
                    type: string
                  -
                    type: array
                    items:
                      type: string
              nullable: true
            stop:
              type: string
            logs:
              type: object
              additionalProperties:
                oneOf:
                  -
                    type: string
                  -
                    type: number
                  -
                    type: boolean
              nullable: true
            file_denylist:
              type: array
              nullable: true
              items:
                type: string
            extends:
              type: integer
              nullable: true
        startup:
          type: string
        script:
          type: object
          required:
            - privileged
            - install
            - entry
            - container
            - extends
          properties:
            privileged:
              type: boolean
              nullable: true
            install:
              type: string
              nullable: true
            entry:
              type: string
            container:
              type: string
            extends:
              type: integer
              nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        extensions:
          $ref: '#/components/schemas/ExtensionFields'
        relationships:
          type: object
          properties:
            variables:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminEggVariableListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
            tags:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminTagListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
            servers:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminServerListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
    AdminEggConfigurationFile:
      type: object
      properties:
        parser:
          type: string
        find:
          $ref: '#/components/schemas/AdminEggConfigurationFind'
    AdminEggConfigurationFiles:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/AdminEggConfigurationFile'
    AdminEggConfigurationFind:
      type: object
      additionalProperties:
        oneOf:
          -
            type: string
          -
            type: number
          -
            type: boolean
          -
            type: object
            additionalProperties:
              type: string
    AdminEggListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminEggResource'
    AdminEggPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminEggResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminEggResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminEggAttributes'
        meta:
          type: object
          required:
            - resource
          properties:
            resource:
              type: string
    AdminEggVariableAttributes:
      type: object
      required:
        - id
        - egg_id
        - name
        - description
        - env_variable
        - default_value
        - user_viewable
        - user_editable
        - rules
        - sort_order
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        egg_id:
          type: integer
        name:
          type: string
        description:
          type: string
        env_variable:
          type: string
        default_value:
          type: string
        user_viewable:
          type: boolean
        user_editable:
          type: boolean
        rules:
          type: string
        sort_order:
          type: integer
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    AdminEggVariableListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminEggVariableResource'
    AdminEggVariableResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminEggVariableAttributes'
    AdminExtensionFormsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: 'The extensions whose fields each admin form shows, keyed by form (admin.user, admin.server, admin.node, admin.egg, admin.location, admin.mount, admin.database_host). Forms without any are left out.'
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                name:
                  type: string
    AdminExtensionSettingField:
      type: object
      required:
        - input
        - label
        - help
        - tab
        - field
        - options
        - value
        - constraints
        - visibility
      properties:
        input:
          type: string
        label:
          type: string
        help:
          type: string
          nullable: true
        tab:
          type: string
          nullable: true
        field:
          type: string
          enum:
            - text
            - password
            - number
            - toggle
            - select
            - color
            - textarea
            - multiselect
            - list
            - file
        options:
          type: array
          items:
            $ref: '#/components/schemas/AdminExtensionSettingOption'
        value:
          oneOf:
            -
              type: string
            -
              type: number
            -
              type: boolean
            -
              type: array
              items:
                oneOf:
                  -
                    type: string
                  -
                    type: number
          nullable: true
        constraints:
          type: object
          required:
            - max_length
            - max_items
            - max_kilobytes
            - accept
          properties:
            max_length:
              type: integer
              nullable: true
            max_items:
              type: integer
              nullable: true
            max_kilobytes:
              type: integer
              nullable: true
            accept:
              type: array
              items:
                type: string
        visibility:
          type: string
          enum:
            - admin
            - frontend
            - public
    AdminExtensionSettingOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          oneOf:
            -
              type: string
            -
              type: number
            -
              type: boolean
        label:
          type: string
    AdminLanguagesResponse:
      type: object
      description: 'Available panel locales keyed by locale code.'
      additionalProperties:
        type: string
    AdminLocationAttributes:
      type: object
      required:
        - id
        - short
        - long
        - nodes_count
        - servers_count
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        short:
          type: string
        long:
          type: string
        nodes_count:
          type: integer
        servers_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        extensions:
          $ref: '#/components/schemas/ExtensionFields'
        relationships:
          type: object
          properties:
            nodes:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminNodeListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
    AdminLocationPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminLocationResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminLocationResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminLocationAttributes'
        meta:
          type: object
          required:
            - resource
          properties:
            resource:
              type: string
    AdminMountAttributes:
      type: object
      required:
        - id
        - uuid
        - name
        - description
        - source
        - target
        - read_only
        - user_mountable
        - eggs_count
        - nodes_count
        - servers_count
      properties:
        id:
          type: integer
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        source:
          type: string
        target:
          type: string
        read_only:
          type: boolean
        user_mountable:
          type: boolean
        eggs_count:
          type: integer
        nodes_count:
          type: integer
        servers_count:
          type: integer
        mounted:
          type: boolean
          description: 'Present only when listed in the context of a server.'
          nullable: true
        extensions:
          $ref: '#/components/schemas/ExtensionFields'
        relationships:
          type: object
          properties:
            eggs:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminEggListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
            nodes:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminNodeListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
            servers:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminServerListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
    AdminMountListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminMountResource'
    AdminMountPaginatedResponse:
      type: object
      required:
        - object
        - data
        - meta
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminMountResource'
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
    AdminMountResource:
      type: object
      required:
        - object
        - attributes
      properties:
        object:
          type: string
        attributes:
          $ref: '#/components/schemas/AdminMountAttributes'
        meta:
          type: object
          required:
            - resource
          properties:
            resource:
              type: string
    AdminNodeAttributes:
      type: object
      required:
        - id
        - uuid
        - public
        - name
        - description
        - location_id
        - fqdn
        - scheme
        - behind_proxy
        - maintenance_mode
        - memory
        - memory_overallocate
        - disk
        - disk_overallocate
        - upload_size
        - daemon_listen
        - daemon_sftp
        - daemon_base
        - created_at
        - updated_at
        - allocated_resources
      properties:
        id:
          type: integer
        uuid:
          type: string
        public:
          type: boolean
        name:
          type: string
        description:
          type: string
          nullable: true
        location_id:
          type: integer
        fqdn:
          type: string
        scheme:
          type: string
        behind_proxy:
          type: boolean
        maintenance_mode:
          type: boolean
        memory:
          type: integer
        memory_overallocate:
          type: integer
        disk:
          type: integer
        disk_overallocate:
          type: integer
        upload_size:
          type: integer
        daemon_listen:
          type: integer
        daemon_sftp:
          type: integer
        daemon_base:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        servers_count:
          type: integer
          description: 'Present when the endpoint loads server counts.'
        allocated_resources:
          type: object
          required:
            - memory
            - disk
          properties:
            memory:
              type: integer
            disk:
              type: integer
        extensions:
          $ref: '#/components/schemas/ExtensionFields'
        relationships:
          type: object
          properties:
            location:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminLocationResource'
                -
                  $ref: '#/components/schemas/NullResource'
            tags:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminTagListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
            deployment_tags:
              oneOf:
                -
                  $ref: '#/components/schemas/AdminTagListResponse'
                -
                  $ref: '#/components/schemas/NullResource'
    AdminNodeConfigurationResponse:
      type: object
      required:
        - debug
        - uuid
        - token_id
        - token
        - api
        - system
        - allowed_mounts
        - remote
      properties:
        debug:
          type: boolean
        uuid:
          type: string
        token_id:
          type: string
        token:
          type: string
        api:
          type: object
          required:
            - host
            - port
            - ssl
            - upload_limit
          properties:
            host:
              type: string
            port:
              type: integer
            ssl:
              type: object
              required:
                - enabled
                - cert
                - key
              properties:
                enabled:

paths:
  /api/admin/languages:
    get:
      summary: 'List languages'
      operationId: adminListLanguages
      description: 'Returns the languages available for panel locale selectors.'
      parameters: []
      responses:
        '200':
          description: 'Available languages returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLanguagesResponse'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      tags:
        - 'Admin API'
  /api/admin/activity:
    get:
      summary: 'List activity'
      operationId: adminListActivity
      description: 'Returns a paginated list of administrative activity. Only events in the "admin" namespace are returned; customer activity against a server or account is excluded.'
      parameters:
        -
          in: query
          name: 'filter[event]'
          description: 'Filter activity by event name.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityFilterEventQueryParameter'
        -
          in: query
          name: 'filter[ip]'
          description: 'Filter activity by originating IP address.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityFilterIpQueryParameter'
        -
          in: query
          name: 'filter[user]'
          description: 'Filter activity by the username or email of the user that performed it.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityFilterUserQueryParameter'
        -
          in: query
          name: 'filter[user_id]'
          description: 'Filter activity to a single user by ID. Preferred over filter[user] when the exact user is known.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityFilterUserIdQueryParameter'
        -
          in: query
          name: 'filter[event_name]'
          description: 'Filter activity to one exact event name. Preferred over filter[event], which matches substrings.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityFilterEventNameQueryParameter'
        -
          in: query
          name: sort
          description: 'Sort activity by timestamp. Prefix with "-" for descending order.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivitySortQueryParameter'
        -
          in: query
          name: page
          description: 'Page number to return.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityPageQueryParameter'
        -
          in: query
          name: per_page
          description: 'Results to return per page. The maximum is 100.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityPerPageQueryParameter'
        -
          in: query
          name: include
          description: 'Comma-separated relationships to include. Supports actor.'
          required: false
          schema:
            $ref: '#/components/schemas/AdminListActivityIncludeQueryParameter'
      responses:
        '200':
          description: 'Activity logs returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActivityLogPaginatedResponse'
        '401':
          description: 'Authentication credentials were missing or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'The API key does not have permission to perform this action.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'The submitted data is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
      tags:
        - 'Admin API'
  /api/admin/activity/filters:
    get:
      summary: 'List activity filter options'
      operationId: adminListActivityFilterOptions
      description: 'Returns the distinct events and users present in the administrative activity log.'
      parameters: []
      responses:
        '200':
          description: 'Filter options returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListActivityFilterOptionsResponseBody'
        '401':

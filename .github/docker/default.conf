# If using Ubuntu this file should be placed in:
# 			/etc/nginx/sites-available/
#
# If using CentOS this file should be placed in:
#				 /etc/nginx/conf.d/
#
server {
    listen 80;
    server_name _;
    
    root /app/public;
    index index.html index.htm index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /assets/ {
        # Compress static build output only. Dynamic responses stay uncompressed so
        # secrets in them cannot leak through compression side channels (BREACH).
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

        location ~ /\. {
            deny all;
        }

        # Extension files are third-party content on the panel's origin. The sandbox stops a
        # file opened directly (an SVG, say) from running script as the panel; scripts the
        # panel imports are unaffected. ^~ skips the regex locations above, so dotfiles are
        # denied again here.
        location ^~ /assets/extensions/ {
            add_header Content-Security-Policy "sandbox" always;
            add_header X-Content-Type-Options nosniff always;

            location ~ /\. {
                deny all;
            }

            try_files $uri =404;
        }

        # Build output is content-hashed, so it never changes under the same name.
        # Extension assets keep their own names and are revalidated as usual.
        location ~ "^/assets/(?!extensions/).+\.[A-Za-z0-9_-]{8}\.(?:js|css|svg|woff2?)$" {
            expires 1y;
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log off;
    error_log  /var/log/nginx/pterodactyl.app-error.log error;

    # allow larger file uploads and longer script runtimes
    client_max_body_size 100m;
    client_body_timeout 120s;
  
    sendfile off;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # the fastcgi_pass path needs to be changed accordingly when using CentOS
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }
}
